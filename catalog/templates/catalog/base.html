{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}PZT{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'catalog/css/style.css' %}" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <header class="header">
      <div class="logo">PZT<span>.</span></div>

      
    </header>

    <aside class="sidebar">
      <nav class="sidebar_nav">
        <a
          href="{% url 'release_list' %}"
          class="sidebar_link {% if request.resolver_match.url_name == 'release_list' %}active{% endif %}"
        >
          <i data-lucide="house"></i>
        </a>

        <a
          href="{% url 'releases' %}"
          class="sidebar_link {% if request.resolver_match.url_name == 'releases' or request.resolver_match.url_name == 'release_detail' %}active{% endif %}"
        >
          <i data-lucide="disc-3"></i>
        </a>

        <a
          href="{% url 'artist_list' %}"
          class="sidebar_link {% if request.resolver_match.url_name == 'artist_list' or request.resolver_match.url_name == 'artist_detail' %}active{% endif %}"
        >
          <i data-lucide="users"></i>
        </a>
        {% if request.user.is_superuser %}
    <a
        href="{% url 'musicbrainz_search' %}"
        class="sidebar_link"
        title="MusicBrainz Search"
    >
        <i data-lucide="search"></i>
    </a>
{% endif %}
      </nav>
    </aside>

    <main class="main">{% block content %} {% endblock %}</main>

    <script src="{% static 'catalog/js/script.js' %}"></script>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
